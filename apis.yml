aid: xfers
name: Xfers
description: Xfers is a Southeast Asian payments infrastructure company founded in Singapore
  in 2015 and backed by 500 Global, providing bank-transfer collection, payouts, escrow-style
  wallets, and lending disbursement APIs across Singapore and Indonesia. Xfers merged with
  Payfazz in 2022 to form the Fazz Financial Group, with its regulated Singapore dollar
  stablecoin and payments business continuing as StraitsX; the Xfers v3 API documentation
  for Singapore and Indonesia remains published at docs.xfers.io.
