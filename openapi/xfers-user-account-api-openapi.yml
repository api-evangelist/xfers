  /v3/user/activities:
    get:
      operationId: getTransactionHistory
      x-code-samples:
      - lang: Shell
        source: "curl --location --request GET \"$BASE_URL/v3/user/activities\" \\\r\n  --header \"Content-Type: application/x-www-form-urlencoded\" \\\r\n  --header \"X-XFERS-USER-API-KEY: $CUSTOMER_API_KEY\" \\\r\n  --data \"\""
      tags:
      - User Account
      summary: Get Transaction History
      description: "This API displays a user’s transaction history. \n\n\nThis API displays a user’s transaction history.\n\nI.e. user’s transactions with other merchants will not be displayed."
      security:
      - X-XFERS-USER-API-KEY: []
      parameters:
      - name: limit
        in: query
        description: Max number of results to return per page.
        required: false
        explode: true
        schema:
          type: integer
          default: 50
      - name: start_date
        in: query
        description: Earliest date to query
        required: false
        explode: true
        schema:
          type: string
          format: DateTime, iso8601 format.URL encode this.
          default: 1 month ago
      - name: end_date
        in: query
        description: Latest date to query
        required: false
        explode: true
        schema:
          type: string
          format: DateTime, iso8601 format.URL encode this.
          default: Now
      - name: offset
        in: query
        description: Offset results for pagination purposes.
        required: false
        explode: true
        schema:
          type: integer
          default: 0
      - name: types
        in: query
        description: Will only show transactions of that type. You can add additional types by separating with a comma.
        required: false
        explode: true
        schema:
          enum:
          - Charge
          - Payout
          - Deposit
          - Withdrawal
          type: string
          default: All types included
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                activities:
                - fee: 0
                  created_at: '2019-09-18T14:58:29+08:00'
                  wallet_name: Digital Goods
                  id: contract_52683616c80b4c91bc6d6aa83eca4874
                  amount: 559
                  status: completed
                  type: Transfer
                  metadata:
                    origin_name: John Tan
                    destination_name: ABC Business
                    description: This is a charge, money is moving from a customer to the business account
                  order_id: '12345'
                  invoice_id: null
                - fee: 0
                  created_at: '2019-09-18T11:55:04+08:00'
                  wallet_name: Digital Goods
                  id: contract_402539e247424cf1af35aae32b087727
                  amount: -695.29
                  status: completed
                  type: Transfer
                  metadata:
                    origin_name: ABC Business
                    destination_name: Mary Jane
                    description: This is a payout, money is moving from the business account to a customer
                  order_id: null
                  invoice_id: '87676'
                - fee: 0
                  created_at: '2019-08-25T21:47:59+08:00'
                  wallet_name: Digital Goods
                  id: contract_aaebb4c688ea4a34b73ede332a5c78c3
                  amount: -99.88
                  status: completed
                  type: Withdrawal
                  metadata:
                    description: POSB 208767841
                - fee: 0
                  created_at: '2019-08-24T14:50:43+08:00'
                  wallet_name: Digital Goods
                  id: contract_e8db413d5f94476aa38de79b04128db6
                  amount: 300
                  status: completed
                  type: Deposit
                  metadata:
                    description: Xfers - CIMB
                activities_returned: 10
                limit: 10
                offset: 0
                start_date: '2019-08-20T14:02:38+08:00'
                end_date: '2019-09-20T23:59:59+08:00'
              schema:
                properties:
                  id:
                    type: string
                    description: ID of the Charge/Payout/Withdrawal/Payout. You can use this ID to query Charges and Payouts.
                  type:
                    type: string
                    description: Transaction type. Charge and Payout are named as 'Transfer', because they are internal transfers between two xfers accounts.
                    enum:
                    - Transfer
                    - Deposit
                    - Withdrawal
                  order_id:
                    type: string
                    description: If it is a charge, it will have a order_id
                  invoice_id:
                    type: string
                    description: If it is a payout, it will have a invoice_id
                  amount:
                    type: float
                    description: If money going out of account, negative. If coming in, positive. Note that only a completed Charge will actually deduct money. For example, if a Charge is expired/accepted/pending/unclaimed, no money will actually flow in/out of the wallet, even though there is a amount displayed.
                  fee:
                    type: float
                    description: Fee charged by Xfers for the transaction, if any. Will be 0 if no fees
                  metadata:
                    type: object
                    description: Shows additional information about a transaction
                  activities_returned:
                    type: integer
                    description: Number of activities returned. If activities returned is less than the limit, this is the final page.
        4XX:
          $ref: '#/components/responses/v3Error:4XX'
  /v3/user/transfer_info:
    get:
      operationId: getTransferInfo
      x-code-samples:
      - lang: Shell
        source: "curl --location --request GET \"$BASE_URL/v3/user\" \\\r\n  --header \"X-XFERS-USER-API-KEY: $CUSTOMER_API_KEY\""
      tags:
      - User Account
      summary: Get Transfer Info / Get Virtual Account Number
      description: "API to get bank account number to be shown to user.  \r\nPlease consult with us to get topup instruction template text to be shown.\r\n\r\nThe common usage of this API is to parse the transfer_info_array given by us and parse it and use the VA numbers of the bank you want\r\n\r\n#### For Virtual Account solution:  \r\nThis API is to get the Virtual Account Number to be displayed to the user\r\n\r\n#### For non Virtual Account solution:  \r\nThis API will show the bank account number to do top up.  \r\nPlease consult with us as this solution will require user to use some other identifier to detect the deposit."
      security:
      - X-XFERS-USER-API-KEY: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                bank_name_full: Bank Permata
                bank_abbrev: PERMATA
                bank_name_abbreviation: PERMATA
                bank_account_no: '8773162088567819'
                bank_payee_name: PT Xfers Indonesia Teknologi
                bank_code: '013'
                branch_code: ''
                branch_area: ''
                unique_id: '87785725657'
                img_src: https://d2ukkkjyjaezp4.cloudfront.net/assets/bank-logo-permata-32f25d774c784800bf92310ab010491d5f18af9fecef716ce1c61bb2ce12070d.png
                transfer_info_array:
                - bank_name_full: Bank Permata
                  bank_abbrev: PERMATA
                  bank_name_abbreviation: PERMATA
                  bank_account_no: '8773162088567819'
                  bank_code: '013'
                  branch_code: ''
                  branch_area: ''
                  unique_id: '87785725657'
                  img_src: https://d2ukkkjyjaezp4.cloudfront.net/assets/bank-logo-permata-32f25d774c784800bf92310ab010491d5f18af9fecef716ce1c61bb2ce12070d.png
                - bank_name_full: Bank Mandiri
                  bank_abbrev: MANDIRI
                  bank_name_abbreviation: MANDIRI
                  bank_account_no: '8830812088567819'
                  bank_code: 008
                  branch_code: ''
                  branch_area: ''
                  unique_id: '87785725657'
                  img_src: https://d2ukkkjyjaezp4.cloudfront.net/assets/bank-logo-mandiri-3c9030412a3deb3c41589344a9a7bf74a52ef8dd278834d400b917f35e1b3bf9.png
                wallet_name: Xfers
              schema:
                properties:
                  id:
                    description: ID of the Charge/Payout/Withdrawal/Payout. You can use this ID to query Charges and Payouts.
                  type:
                    description: activity type
                    enum:
                    - Credit Card
                    - Charge
                    - Payout
                    - Withdrawal
                    - Deposit
                  amount:
                    description: If money going out of account, negative. If coming in, positive. Note that only a completed Charge will actually deduct money. For example, if a Charge is expired/accepted/pending/unclaimed, no money will actually flow in/out of the wallet, even though there is a amount displayed.
                  fee:
                    description: Fee charged by Xfers for the transaction, if any. Will be 0 if no fees
                  metadata:
                    type: object
                    description: Shows additional information about a transaction
                  activities_returned:
                    type: string
                    description: Number of activities returned. If activities returned is less than the limit, this is the final page.
        4XX:
          $ref: '#/components/responses/v3Error:4XX'
