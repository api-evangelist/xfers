openapi: 3.0.0
info:
  description: Welcome to Xfers' API documentation. You can find information on our API endpoint specific to your country.
  version: '3'
  title: Xfers Bank Account User Account API
  contact:
    name: Contact us through our help desk
    url: https://bit.ly/XfersSupport
servers:
- description: Indonesia Production
  url: https://id.xfers.com/api
- description: Indonesia Sandbox for testing
  url: https://sandbox-id.xfers.com/api
tags:
- name: User Account
  description: Manage User and Accounts
paths:
  /v3/user:
    get:
      operationId: getUserInfo
      x-code-samples:
      - lang: Shell
        source: "curl --location --request GET \"{base_url}/user\" \\\r\n  --header \"X-XFERS-USER-API-KEY: 2zsujd47H3-UmsxDL784beVnYbxCYCzL4psSbwZ_Ngk\""
      tags:
      - User Account
      summary: Get User Info
      description: "The main usage of this API is to get the current user. One user can have multiple accounts, and the balance returned is the account tied to the current API token. \r\nYou can also use this API to check various data of the user such as first_name, last_name.\r\n\r\nDescription of some notable response\r\n\r\nKey | Value | Description \r\n--------------- |  ----------- | -----\r\nkyc_status | fully_verified | current_kyc_status of user, enum of `not_submitted`, `in_process`, `rejected`, `fully_verified`"
      security:
      - user-api-token: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: user_gksj43jgzgqv
                available_balance: '2595750.79'
                ledger_balance: '2595750.79'
                bank_transfer_rates: '0.0'
                bank_transfer_fees: '0.45'
                first_name: docs.xfers.io
                last_name: testingaccount
                date_of_birth: '1990-11-09'
                country_of_birth: SG
                gender: male
                email: docs@xfers.com
                country: sg
                state: Singapore
                city: Singapore
                nationality: Singaporean
                address_line_1: Blk 71 Ayer Rajah Cresent
                address_line_2: '#02-52'
                postal_code: '541121'
                nric_type: ''
                identity_no: S8117102G
                nric_issue_date: ''
                phone_no: '+6281128125'
                bank_accounts:
                - id: 329
                  account_no: '800006788912'
                  account_holder_name: Tian Wei
                  detected_name: PROD ONLY
                  verification_status: pending
                  verified: true
                  bank_abbrev: CIMB_NIAGA
                  usage: all
                - id: 561
                  account_no: '2480096820'
                  account_holder_name: null
                  detected_name: PROD ONLY
                  verification_status: pending
                  verified: true
                  bank_abbrev: BCA
                  usage: all
                annual_income: ''
                id_front: 15357011921535007959147096578.jpg
                id_front_url: https://sandbox-xfers-id.s3-ap-southeast-1.amazonaws.com/users/nric_fronts/000/000/383/original/15357011921535007959147096578.jpg?AWSAccessKeyId=REDACTED-EXAMPLE&Expires=1540979796&Signature=REDACTED-EXAMPLE
                selfie_2id: 15357011921535007959147096578.jpg
                selfie_2id_url: https://sandbox-xfers-id.s3-ap-southeast-1.amazonaws.com/users/nric_selfies/000/000/383/original/15357011921535007959147096578.jpg?AWSAccessKeyId=REDACTED-EXAMPLE&Expires=1540979796&Signature=REDACTED-EXAMPLE
                account_locked: false
                google_auth_enabled: false
                kyc_verified: true
                kyc_needed: true
                meta_data: ''
                display_name: XfersDocsTest
                avatar: cardProfileDefault.png
                avatar_url: cardProfileDefault.png
